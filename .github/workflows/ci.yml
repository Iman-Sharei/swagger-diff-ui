name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Sample project check + schema export + CLI
        working-directory: examples/sample_project
        env:
          DJANGO_SETTINGS_MODULE: sample_project.settings
        run: |
          python manage.py check
          python manage.py spectacular --file /tmp/sample-schema.json --format openapi-json
          python manage.py swagger_diff --ref HEAD --format text --no-cache
